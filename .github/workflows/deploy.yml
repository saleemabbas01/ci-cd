
  name: Spring Boot Build and Deploy

  on:
    push:
      branches:
        - master

  env:
    IMAGE_NAME: spring-boot-web

  jobs:
    build-deploy:
      runs-on: ubuntu-latest

      steps:
        # Step 1: Checkout Source Code
        - name: Checkout Source
          uses: actions/checkout@v4

        # Step 2: Setup Java 21
        - name: Set Up Java 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        # Step 3: Make Maven Wrapper Executable
        - name: Make Maven Wrapper executable
          run: chmod +x mvnw

        # Step 4: Build and Test Spring Boot Application
        - name: Build and Test JAR
          run: ./mvnw --batch-mode clean verify

        # Step 5: Setup Docker Buildx
        - name: Set Up Docker Buildx
          uses: docker/setup-buildx-action@v3

        # Step 6: Login to Docker Hub
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        # Step 7: Build and Push AMD64 Docker Image
        - name: Build and Push AMD64 Docker Image
          uses: docker/build-push-action@v6
          with:
            context: .
            platforms: linux/amd64
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

        # Step 8: Deploy Application to EC2
        - name: Deploy to EC2
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
              
              docker stop spring-boot-web || true
              docker rm spring-boot-web || true
              
              docker run -d \
                --name spring-boot-web \
                --restart unless-stopped \
                -p 8080:8080 \
                ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
              
              docker image prune -f
    
